<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizing Tool Source | Hekmat Kawas</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <style>
        :root { --ink: #0F172A; --body: #334155; --muted: #64748B; --line: #E2E8F0; --paper: #F8FAFC; --accent: #0E7490; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--body); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
        header { background: #fff; border-bottom: 1px solid var(--line); }
        .bar { max-width: 1152px; margin: 0 auto; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .bar a { color: var(--ink); font-weight: 700; text-decoration: none; }
        .bar a.cta { font-size: 14px; font-weight: 600; color: #fff; background: var(--accent); padding: 8px 14px; border-radius: 6px; }
        main { max-width: 1152px; margin: 0 auto; padding: 32px 16px; }
        h1 { color: var(--ink); font-size: 30px; margin: 0 0 6px; letter-spacing: -0.02em; }
        .lead { margin: 0 0 24px; }
        .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
        nav { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; position: sticky; top: 16px; }
        nav button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px;
            font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--body); cursor: pointer; }
        nav button:hover { color: var(--accent); background: var(--paper); }
        nav button[aria-current="true"] { background: var(--ink); color: #fff; }
        .viewer { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
        .viewer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
        .viewer-head strong { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .viewer-head a { color: var(--muted); }
        pre { margin: 0; }
        pre code.hljs { padding: 16px; font-size: 13px; line-height: 1.55; background: #fff; }
        @media (max-width: 760px) {
            .layout { grid-template-columns: 1fr; }
            nav { position: static; display: flex; flex-wrap: wrap; gap: 4px; }
            nav button { width: auto; }
        }
    </style>
</head>
<body>
    <header>
        <div class="bar">
            <a href="/">Hekmat Kawas</a>
            <a class="cta" href="/calculator">Open the calculator</a>
        </div>
    </header>
    <main>
        <h1>Process Equipment Sizing Tool: Python source</h1>
        <p class="lead">The Streamlit app and calculation modules behind the live calculator. Pick a file to read it.</p>
        <div class="layout">
            <nav id="files" aria-label="Source files"></nav>
            <section class="viewer">
                <div class="viewer-head"><strong id="name"></strong><a id="raw" href="#" download>Download</a></div>
                <pre><code id="code" class="language-python"></code></pre>
            </section>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        const FILES = ["README.md", "app.py", "main.py", "piping.py", "pipe_sizing.py", "system.py", "pump.py",
            "npsh.py", "heat_exchanger.py", "tank.py", "reactions.py", "flash.py", "units.py"];
        const nav = document.getElementById("files");

        async function show(file) {
            nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.textContent === file));
            document.getElementById("name").textContent = file;
            document.getElementById("raw").href = file;
            const code = document.getElementById("code");
            code.className = file.endsWith(".md") ? "language-markdown" : "language-python";
            code.removeAttribute("data-highlighted");
            try {
                const res = await fetch(file);
                code.textContent = res.ok ? await res.text() : "Could not load " + file;
            } catch {
                code.textContent = "Could not load " + file;
            }
            if (window.hljs) hljs.highlightElement(code);
            history.replaceState(null, "", "#" + file);
        }

        FILES.forEach(file => {
            const b = document.createElement("button");
            b.textContent = file;
            b.onclick = () => show(file);
            nav.appendChild(b);
        });
        const initial = decodeURIComponent(location.hash.slice(1));
        show(FILES.includes(initial) ? initial : "README.md");
    </script>
</body>
</html>
